name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1' # weekly: catches drift in the public sandboxes

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  API_BASE_URL: https://restful-booker.herokuapp.com
  CONTRACT_SCHEMA_URL: https://petstore3.swagger.io/api/v3/openapi.json
  CONTRACT_BASE_URL: https://petstore3.swagger.io/api/v3

jobs:
  quality:
    name: Ruff · mypy (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  functional:
    name: Functional (pytest + httpx + JSON Schema)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: mkdir -p reports && uv run pytest tests/functional -n 4 -q --junitxml=reports/junit-functional.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-functional
          path: reports/junit-functional.xml

  contract:
    name: Contract (Schemathesis)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    env:
      CONTRACT_MAX_EXAMPLES: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: mkdir -p reports && uv run pytest tests/contract -q --junitxml=reports/junit-contract.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-contract
          path: reports/junit-contract.xml

  perf:
    name: Performance smoke (k6 thresholds)
    runs-on: ubuntu-latest
    needs: functional
    timeout-minutes: 10
    env:
      K6_VUS: 5
      K6_DURATION: 30s
      K6_P95_MS: 1500
      K6_ERROR_RATE: 0.02
    steps:
      - uses: actions/checkout@v7
      - uses: grafana/setup-k6-action@v1
      - name: Run k6 (fails the job when a threshold is crossed)
        run: mkdir -p reports && k6 run perf/k6/smoke.js
      - name: Publish threshold summary
        if: always()
        run: |
          {
            echo "## k6 smoke"
            echo
            echo '| metric | p(95) ms | threshold |'
            echo '|---|---:|---|'
            jq -r --arg p95 "$K6_P95_MS" '
              ["http_req_duration","http_req_duration{name:ping}","http_req_duration{name:list}","http_req_duration{name:get}"][]
              | . as $m | "| \($m) | \(($metrics[$m]["p(95)"] // 0) | floor) | p(95)<\($p95) |"' --argjson metrics "$(jq .metrics reports/k6-summary.json)" -n
            echo
            echo "error rate: $(jq -r '.metrics.http_req_failed.value * 100 | tostring' reports/k6-summary.json)% (threshold ${K6_ERROR_RATE})"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: k6-summary
          path: reports/k6-summary.json

  docker:
    name: Same suite in Docker
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: api-quality-toolkit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Functional smoke inside the image
        run: docker run --rm -e API_BASE_URL api-quality-toolkit:ci tests/functional -m smoke -q
